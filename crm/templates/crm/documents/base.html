<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ document_title }} {{ order.number }}</title><style>body{font:15px Arial;color:#18202b;max-width:820px;margin:30px auto;padding:20px}body>header{display:flex;justify-content:space-between;border-bottom:3px solid #18a66a;padding-bottom:18px}h1{font-size:25px}h2{font-size:17px;margin-top:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{padding:12px;background:#f3f7f5;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.sign{margin-top:60px;display:flex;justify-content:space-between}.print-button{position:fixed;right:22px;top:18px;padding:11px 18px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}{% block document_style %}{% endblock %}@media print{.print-button{display:none}body{margin:0}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body class="{% block body_class %}{% endblock %}"><button class="print-button" type="button" onclick="window.print()">Печать</button>{% block document_header %}<header><div><b>{{ settings.workshop_name }}</b><div>{{ settings.address }}</div><div>{{ settings.phone }} {{ settings.email }}</div></div><div><b>{{ document_title }}</b><br>Заказ {{ order.number }}</div></header>{% endblock %}{% block document %}{% endblock %}</body></html>
