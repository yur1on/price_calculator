<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ document_title }} {{ order.number }}</title><style>body{font:15px Arial;color:#18202b;max-width:820px;margin:30px auto;padding:20px}body>header{display:flex;justify-content:space-between;border-bottom:3px solid #18a66a;padding-bottom:18px}h1{font-size:25px}h2{font-size:17px;margin-top:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{padding:12px;background:#f3f7f5;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.sign{margin-top:60px;display:flex;justify-content:space-between}.document-actions{position:fixed;right:22px;top:18px;display:flex;gap:8px}.document-actions a,.print-button{padding:11px 18px;border:0;border-radius:9px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.document-actions a{background:#fff;color:#253247;box-shadow:0 2px 10px rgba(15,23,42,.15)}.print-button{background:#1769e0;color:#fff}{% block document_style %}{% endblock %}@media print{.document-actions{display:none}body{margin:0}}@media(max-width:600px){.grid{grid-template-columns:1fr}.document-actions{left:10px;right:10px;top:10px;justify-content:flex-end}.document-actions a,.print-button{padding:9px 12px}}</style></head><body class="{% block body_class %}{% endblock %}"><nav class="document-actions" aria-label="Действия с документом">{% block document_back %}{% endblock %}<button class="print-button" type="button" onclick="window.print()">Печать</button></nav>{% block document_header %}<header><div><b>{{ settings.workshop_name }}</b><div>{{ settings.address }}</div><div>{{ settings.phone }} {{ settings.email }}</div></div><div><b>{{ document_title }}</b><br>Заказ {{ order.number }}</div></header>{% endblock %}{% block document %}{% endblock %}{% block document_scripts %}{% endblock %}</body></html>
