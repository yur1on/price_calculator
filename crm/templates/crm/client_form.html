{% extends "crm/base.html" %}
{% block crm_title %}{{ title }}{% endblock %}
{% block crm_content %}
<header class="crm-page-head"><div><span class="crm-eyebrow">Клиенты</span><h1>{{ title }}</h1><p class="crm-muted">Рабочие контактные данные клиента</p></div></header>
<form method="post" class="crm-panel crm-form crm-form--compact">
  {% csrf_token %}
  <div class="crm-grid crm-grid--2">{% for field in form %}{% include "crm/field.html" with field=field %}{% endfor %}</div>
  <div class="crm-actions"><button class="crm-btn crm-btn--primary" type="submit">Сохранить</button><a class="crm-btn" href="{% if client %}{% url 'crm:client_detail' client.pk %}{% else %}{% url 'crm:client_list' %}{% endif %}">Отмена</a></div>
</form>
{% endblock %}
