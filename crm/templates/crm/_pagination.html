{% if page_obj.paginator.num_pages > 1 %}<nav class="crm-pagination">
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&{{ request.GET.urlencode }}">←</a>{% endif %}
  <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&{{ request.GET.urlencode }}">→</a>{% endif %}
</nav>{% endif %}
