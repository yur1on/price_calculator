  <a href="{% url 'crm:dashboard' %}" class="crm-icon-link crm-icon-link--orders {% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'order_detail' %}is-active{% endif %}"><span class="crm-rail-icon crm-rail-icon--chart"></span><span>Заказы</span></a>
