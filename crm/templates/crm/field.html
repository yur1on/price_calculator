<div class="crm-field{% if primary %} crm-field--primary{% endif %}"{% if primary %} data-primary-field="{{ field.name }}"{% endif %}><label for="{{ field.id_for_label }}"><span>{{ field.label }}</span>{% if primary %}<small class="crm-field-primary__badge">Основное</small>{% endif %}</label>{{ field }}{% for error in field.errors %}<small class="crm-error">{{ error }}</small>{% endfor %}</div>
