<form method="get" class="fin-period">
  <div class="fin-period-presets" aria-label="Быстрый выбор периода">
    <a href="?period=today" class="{% if period == 'today' %}active{% endif %}">Сегодня</a><a href="?period=yesterday" class="{% if period == 'yesterday' %}active{% endif %}">Вчера</a><a href="?period=week" class="{% if period == 'week' %}active{% endif %}">Неделя</a><a href="?period=month" class="{% if period == 'month' %}active{% endif %}">Месяц</a><a href="?period=last_month" class="{% if period == 'last_month' %}active{% endif %}">Прошлый</a><a href="?period=year" class="{% if period == 'year' %}active{% endif %}">Год</a>
  </div>
  <input type="hidden" name="period" value="custom"><label>Дата от<input type="date" name="from" value="{{ date_from|date:'Y-m-d' }}"></label><label>Дата до<input type="date" name="to" value="{{ date_to|date:'Y-m-d' }}"></label><button class="fin-btn primary"><i class="fa-solid fa-filter"></i> Показать</button>
</form>
