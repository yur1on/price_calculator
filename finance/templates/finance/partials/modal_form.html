<div class="wb-modal-form"><div class="fin-section-head"><h2 id="app-modal-title"><i class="fa-solid fa-pen-to-square"></i> {{ title }}</h2></div><form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#app-modal-content" hx-swap="innerHTML" hx-indicator="#wb-loading">{% csrf_token %}{{ form.non_field_errors }}<div class="fin-form-grid">{% for field in form %}<div class="fin-field {% if field.name == 'comment' or field.name == 'description' %}wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field.errors }}{{ field }}{% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}</div>{% endfor %}</div><div class="fin-form-actions"><button class="fin-btn primary"><i class="fa-solid fa-check"></i> Сохранить</button><button class="fin-btn" type="button" data-modal-close>Отмена</button></div></form></div>
