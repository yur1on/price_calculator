{% extends "finance/base.html" %}{% load finance_extras %}{% block finance_title %}Ремонты{% endblock %}{% block finance_content %}
<div class="fin-actions"><a class="fin-btn primary" href="{% url 'finance:repair_create' %}"><i class="fa-solid fa-plus"></i> Добавить ремонт</a></div>
{% include "finance/_period.html" %}
<form method="get" class="fin-filters" hx-get="{% url 'finance:repair_list' %}" hx-trigger="submit, keyup changed delay:400ms from:input[name='q'], change from:select" hx-target="#finance-repair-results" hx-push-url="true" hx-indicator="#wb-loading">
  <input type="hidden" name="period" value="custom"><input type="hidden" name="from" value="{{ date_from|date:'Y-m-d' }}"><input type="hidden" name="to" value="{{ date_to|date:'Y-m-d' }}">
  <label>Поиск<input name="q" value="{{ q }}" placeholder="Описание ремонта" autocomplete="off"></label>
  <label>Мастер<select name="employee"><option value="">Все</option>{% for employee in employees %}<option value="{{ employee.pk }}" {% if selected_employee == employee.pk|stringformat:'s' %}selected{% endif %}>{{ employee }}</option>{% endfor %}</select></label>
  <label>Сортировка<select name="sort"><option value="-date">Сначала новые</option><option value="date" {% if sort == 'date' %}selected{% endif %}>Сначала старые</option><option value="-revenue" {% if sort == '-revenue' %}selected{% endif %}>По сумме</option><option value="-workshop_profit" {% if sort == '-workshop_profit' %}selected{% endif %}>По прибыли</option></select></label>
  <button class="fin-btn primary"><i class="fa-solid fa-filter"></i> Применить</button>
</form>
{% include "finance/partials/repair_results.html" %}
{% endblock %}
