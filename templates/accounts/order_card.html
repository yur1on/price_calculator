<article class="client-order"><div class="client-order__top"><span>{{ order.number }}</span><b class="client-status">{{ order.get_status_display }}</b></div><h3>{{ order.device.display_name }}</h3><p>{{ order.issue_description|truncatechars:90 }}</p><dl><div><dt>Принят</dt><dd>{{ order.accepted_at|date:"d.m.Y" }}</dd></div><div><dt>Стоимость</dt><dd>{{ order.agreed_price }} BYN</dd></div></dl><a href="{% url 'accounts:client_repair_detail' order.pk %}">Подробнее →</a></article>
