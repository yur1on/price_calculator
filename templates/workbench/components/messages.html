{% if messages %}<div class="wb-toasts" aria-live="polite">{% for message in messages %}<div class="wb-toast wb-toast--{{ message.tags|default:'info' }}"><i class="fa-solid fa-circle-check"></i><span>{{ message }}</span><button type="button" data-wb-dismiss aria-label="Закрыть">×</button></div>{% endfor %}</div>{% endif %}
